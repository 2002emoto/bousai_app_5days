{% extends "base.html" %}

{% block title %}避難経路検索画面 - 防災アプリ{% endblock %}

{% block content %}
<h2>避難経路検索画面</h2>

{% if results %}
  <ul>
    {% for shelter in results %}
    <li>{{ shelter.name }}</li>
    {% endfor %}
  </ul>
{% else %}
  <p>該当する避難所が見つかりませんでした</p>
{% endif %}

<p>
  <a href="/shelter_search">検索画面に戻る</a> |
  <a href="/">トップページへ戻る</a>
</p>
{% endblock %}
